[package]
name = "llm-incident-manager"
version = "1.0.1"
edition = "2021"
rust-version = "1.84"
authors = ["LLM DevOps Team"]
description = "Enterprise-grade incident management system for LLM operations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/globalbusinessadvisors/llm-incident-manager"
documentation = "https://docs.rs/llm-incident-manager"
homepage = "https://github.com/globalbusinessadvisors/llm-incident-manager"
keywords = ["incident", "management", "llm", "devops", "observability"]
categories = ["development-tools", "web-programming"]
readme = "README.md"
autobenches = false
autotests = false
exclude = [
    "docs/",
    ".claude-flow/",
    "examples/websocket/",
    "benches/",
    "tests/",
    "node_modules/",
    "config/circuit_breakers.yaml",
    "config/circuit_breakers_production.yaml",
    ".vscode/",
    ".idea/",
    "*.log",
]

[workspace]
members = ["."]

[[bin]]
name = "llm-incident-manager"
path = "src/main.rs"

[[bin]]
name = "llm-im-cli"
path = "src/cli/main.rs"

[dependencies]
# LLM-Dev-Ops Ecosystem Dependencies — FOUR OF FIVE STILL BLOCKED UPSTREAM.
# See docs/adr/ADR-0001-re-enabling-llm-dev-ops-ecosystem-dependencies.md
#
# ADR-0001 decided these come back as tag-pinned git dependencies. Its Implementation
# Plan step 1 makes upstream tags a blocking precondition: each repo must cut a tag
# that builds standalone. Status re-verified 2026-07-27 against the real remotes.
#
# When re-enabling any line below, it MUST carry an immutable `tag`. A bare `git =`
# or a `branch =` re-resolves whenever upstream moves, which is the diamond-dependency
# failure connector-hub hit (ADR-0001, Finding 3). CI enforces this — see the
# `pinning` job in .github/workflows/build-features.yml.
#
#   llm-observatory-core     observatory          0 tags, 0 releases — nothing to pin
#   llm-governance-common    governance-dashboard 0 tags, 0 releases — nothing to pin
#   llm-analytics-hub        analytics-hub        0 tags, 0 releases — nothing to pin
#   policy-engine-benchmarks policy-engine        0 tags, 0 releases — nothing to pin
#
#   llm-sentinel-core        sentinel             UNBLOCKED at tag v0.1.1 — pinned below.
#     v0.1.0 was rejected here for two defects; v0.1.1 fixes both, and the fixes were
#     re-verified by building the tag standalone rather than trusting the tag message:
#       1. Naming. At v0.1.0 the crate was `sentinel-core`, so ADR-0001's target-state
#          line would not have resolved without a `package = "sentinel-core"` alias.
#          At v0.1.1 `crates/sentinel-core/Cargo.toml` declares
#          `name = "llm-sentinel-core"`, so no alias is needed.
#       2. Build. `sentinel-api` moved `axum-test` from the yanked `^16.5` to `18.2`,
#          so the workspace resolves; and `events.rs` no longer applies
#          `#[validate(length(...))]` to the `ServiceId` newtype, so the E0599
#          "no method named `validate_length`" failure against validator 0.18 is gone.
#     Evidence — clean clone of tag v0.1.1 (remote tag -> commit 504b0ea), then
#     `cargo build --workspace`:
#         Finished `dev` profile [unoptimized + debuginfo] target(s) in 14m 52s
#         EXIT=0        (warnings only; zero errors)
#
#     CAVEAT, not papered over: that build ran on stable 1.97.1, which is the only
#     toolchain installed here. ADR-0001 step 1 asks for Rust 1.84 specifically, and
#     1.84 is not available in this environment, so the MSRV half of step 1 is
#     asserted-but-unverified for sentinel — same gap the `msrv` CI job already
#     tracks for this repo's own 1.84 floor.
#
#     Cosmetic upstream inconsistency, noted so nobody thinks the pin is wrong:
#     sentinel did not bump `workspace.package.version` when cutting v0.1.1, so the
#     crate still reports 0.1.0 and `cargo tree` prints
#     `llm-sentinel-core v0.1.0 (...?tag=v0.1.1#504b0ea4)`. The tag is what pins us.
llm-sentinel-core = { git = "https://github.com/LLM-Dev-Ops/sentinel", tag = "v0.1.1", optional = true }

# Async Runtime & Concurrency
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
rayon = "1.8"
crossbeam = "0.8"
# Pin to version compatible with Rust 1.84 (3.4.x requires Rust 1.85)
async-lock = "=3.3.0"

# Web Frameworks & Networking
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
hyper = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }

# GraphQL (6.x series - 7.x requires Rust 2024 edition which isn't stable yet)
async-graphql = { version = "6.0", features = ["chrono", "uuid", "dataloader"] }
async-graphql-axum = "6.0"

# Email Support
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"], default-features = false }

# gRPC Support
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
tonic-health = "0.11"
tonic-reflection = "0.11"
prost = "0.12"
prost-types = "0.12"

# Data Storage & Caching
dashmap = "5.5"
moka = { version = "0.12", features = ["future"] }
sled = "0.34"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "cluster-async"] }
bincode = "1.3"
chrono-tz = "0.8"
regex = "1.10"

# Serialization & Data Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Observability & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
prometheus = "0.13"
lazy_static = "1.4"
parking_lot = "0.12"

# CLI & Configuration
clap = { version = "4.4", features = ["derive", "env", "cargo"] }
config = { version = "0.14", default-features = false, features = ["toml"] }

# Security & Cryptography
sha2 = "0.10"
# Pin to version compatible with Rust 2021 (1.8.x requires Rust 2024)
base64ct = "=1.6.0"

# Error Handling & Validation
anyhow = "1.0"
thiserror = "1.0"
validator = { version = "0.18", features = ["derive"] }

# Date/Time & Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
once_cell = "1.19"

# State Machine
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"

# Machine Learning
linfa = "0.7"
linfa-logistic = "0.7"
linfa-trees = "0.7"
linfa-svm = "0.7"
linfa-nn = "0.7"
ndarray = { version = "0.15", features = ["serde"] }
ndarray-stats = "0.5"
smartcore = "0.3"

# Scheduler & Cron
tokio-cron-scheduler = "0.10"

# Full-Text Search
tantivy = "0.22"

# Message Queues
async-nats = "0.33"
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "libz", "zstd"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
mockito = "1.2"

[build-dependencies]
tonic-build = "0.11"

# Benchmark declarations removed - benches/ directory is excluded from publishing
# To run benchmarks locally: cargo bench
# [[bench]]
# name = "metrics_benchmark"
# harness = false
#
# [[bench]]
# name = "circuit_breaker_benchmark"
# harness = false

[features]
default = []

# Integration with upstream LLM-Dev-Ops crates. See
# docs/adr/ADR-0001-re-enabling-llm-dev-ops-ecosystem-dependencies.md
#
# NO LONGER A NO-OP. `ecosystem` now names a real, tag-pinned dependency, so
# `--features ecosystem` compiles a genuinely different crate graph from a default
# build — which is what ADR-0001 Finding 1 asked for. It is still only ONE of the five
# members: the other four have no tag to pin (see [dependencies]).
#
# The previous comment here claimed "When disabled (default), stub implementations are
# used". That was false: no `cfg(feature = "ecosystem")` gate has ever existed in src/.
# Do not restore that claim without the gates to back it. Enabling this feature today
# pulls llm-sentinel-core into the graph but does not yet change any behaviour, because
# the adapter call sites are still commented out — restoring those is separate work.
#
# Do NOT list a member here without a corresponding tag-pinned entry in [dependencies]
# — a feature naming a non-existent dependency is a manifest error, and a feature
# naming nothing is the exact defect ADR-0001 exists to remove.
ecosystem = ["dep:llm-sentinel-core"]

# `benchmarks` stays unavailable until policy-engine cuts a tag. It is deliberately
# kept separate from `ecosystem` so benchmark-only transitive dependencies never
# reach production builds (ADR-0001, "Per-dependency target state").
# benchmarks = ["dep:policy-engine-benchmarks"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

