name: Build (feature matrix)

# ADR-0001, Implementation Plan step 7 / Verification check 9.
# The `ecosystem` feature names no dependencies and was never compiled in CI, which is
# how it decayed into a no-op without anyone noticing. Both configurations are built
# here so that cannot recur.
#
# HONEST SCOPE: while `ecosystem = []`, the two matrix entries compile an identical
# crate graph, so the `ecosystem` job proves only that the feature name still exists.
# It becomes a real second configuration the moment a `dep:` entry is added. The
# `pinning` job below is the one doing load-bearing work today.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: ecosystem
            features: "--features ecosystem"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # rdkafka is built from source (cmake-build) and tonic-build needs protoc.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake protobuf-compiler libssl-dev zlib1g-dev libsasl2-dev libcurl4-openssl-dev

      # NOTE: this is `stable`, not the declared `rust-version = "1.84"`, because the
      # 1.84 floor is currently broken — see the `msrv` job below for the evidence and
      # why fixing it needs a lockfile rather than a workflow change.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.name }}-

      # ADR-0001's verification steps all specify `cargo build --locked`, but Cargo.lock
      # is gitignored here (.gitignore:5), so `--locked` would fail outright. That is a
      # decision ADR-0001 did not account for: a tag pin only yields a reproducible build
      # if the rest of the graph is locked too. Committing the lockfile is the right
      # follow-up; add `--locked` once it lands.
      - name: Build
        run: cargo build --workspace ${{ matrix.features }}

      # Advisory, not blocking, and time-capped — read this before "fixing" it by deleting
      # the flags. `cargo test --workspace` is broken on main in two separate ways, both
      # pre-existing and unrelated to ADR-0001 (the commit that added this workflow changes
      # only comments). Measured on the first real run of this job:
      #
      #   - 29 tests FAIL, concentrated in metrics::collectors, metrics::decorators and
      #     metrics::interceptors. The pattern points at a shared global metrics registry
      #     that tests mutate concurrently, so they pass alone and fail in parallel.
      #   - The suite then HANGS. It prints `running 478 tests`, produces results, and
      #     stops: a test opens sockets and blocks forever on Redis/NATS/Kafka, which no
      #     runner provides. Confirmed here — the step hit the 20-minute cap. Reproduced
      #     locally at ~30 min, 0% CPU, blocked on futex.
      #
      # Without the cap this burns the full 6h GitHub timeout on every push. Making it
      # blocking today would gate every PR on defects this branch did not introduce.
      # Make it blocking once the metrics tests are serialized (or given a per-test
      # registry) and the networked ones are gated behind a feature or given service
      # containers.
      - name: Test (advisory — 29 pre-existing failures + a hang)
        run: cargo test --workspace ${{ matrix.features }}
        timeout-minutes: 20
        continue-on-error: true

  msrv:
    name: declared MSRV 1.84 (known broken, non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking on purpose. This job documents a real defect rather than hiding it:
    # Cargo.toml declares `rust-version = "1.84"`, and ADR-0001's "Toolchain constraint"
    # treats that as an acceptance criterion — `async-lock = "=3.3.0"` and
    # `base64ct = "=1.6.0"` exist solely to hold the line. It does not currently hold.
    #
    # Cargo.lock is gitignored (.gitignore:5), so a clean 1.84 build resolves every
    # transitive dependency to its newest release, and several now exceed the floor:
    #   chacha20 0.10.1  -> requires edition2024 (unsupported by cargo 1.84.1)
    #   uuid 1.24.0      -> requires Rust 1.85.0
    #   zeroize 1.9.0    -> requires Rust 1.85
    #   wasip2 / wit-bindgen -> require Rust 1.85 / 1.87
    #
    # Two exact pins cannot hold a floor that the whole transitive graph is free to
    # float above. The fix is to commit a lockfile (then add `--locked` to the build
    # job and make this one blocking), or to raise `rust-version` to the truth.
    # Flipping this job to `stable` would make the symptom disappear without fixing it.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake protobuf-compiler libssl-dev zlib1g-dev libsasl2-dev libcurl4-openssl-dev

      - name: Install Rust 1.84
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.84"

      - name: Build on declared MSRV
        run: cargo build --workspace

  pinning:
    name: upstream pins are immutable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ADR-0001 Verification checks 1 and 2. A branch ref or a bare git ref re-resolves
      # whenever upstream moves, which turns a green build red with no commit here.
      #
      # Comment lines are stripped first. The manifest documents these forbidden forms in
      # prose, and a guard that trips over its own documentation is a guard people delete.
      - name: Reject floating git dependencies
        run: |
          manifest=$(grep -vE '^\s*#' Cargo.toml)

          floating=$(echo "$manifest" | grep -nE 'branch\s*=' || true)
          if [ -n "$floating" ]; then
            echo "::error::Cargo.toml pins an upstream to a branch; ADR-0001 requires an immutable tag."
            echo "$floating"
            exit 1
          fi

          untagged=$(echo "$manifest" | grep -nE 'git\s*=\s*"' | grep -v 'tag\s*=' || true)
          if [ -n "$untagged" ]; then
            echo "::error::git dependency without a tag:"
            echo "$untagged"
            exit 1
          fi

          echo "All git dependencies are tag-pinned (or there are none yet)."

# NOT YET COVERED (ADR-0001 step 7 asks for it):
#   cargo build --features benchmarks
# The `benchmarks` feature cannot exist until github.com/LLM-Dev-Ops/policy-engine cuts
# a tag for policy-engine-benchmarks. Add a third matrix entry when it does.
